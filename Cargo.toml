[workspace]
resolver = "2"
members = [
    "crates/nbe-core",
    "crates/nbe-decode",
    "crates/nbe-engine",
    "crates/nbe-preflight",
    "crates/nbe-protocol",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
# jsonschema: add via `cargo add jsonschema --package nbe-core` (see agents/prompts/01-bootstrap-core-preflight.md)

[workspace.lints.rust]
# `deny`, not `forbid`: the render node needs Objective-C FFI to reach
# VideoToolbox for hardware decode (Prompt 05), and `forbid` cannot be
# relaxed even for a single module. The exception is exactly one crate —
# `crates/nbe-decode` — whose `src/lib.rs` carries `#[allow(unsafe_code)]`
# with its justification. Every other crate remains denied, and CI fails if
# `allow(unsafe_code)` appears anywhere outside that crate.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Disk governance on the normative machine (2026-09-14): incremental caching
# churns under this project's commit-mutate-restore falsification discipline
# (target/ hit 32 GB with ~600 MB free). incremental=false drops the
# step-to-step cache; debug="line-tables-only" keeps function names in
# backtraces while dropping most symbol mass. Full debug=0 stays available
# as a later escalation if this isn't enough.
[profile.dev]
incremental = false
debug = "line-tables-only"

# R20 (SPEC §12.8.1, v0.4.8 row 12): a clip streams through its read-ahead, so
# the decoder must keep pace with the house rate in every build that plays a
# clip, and the dress rehearsal and CI play them on the dev-profile engine.
# Measured 2026-10-18 on the normative machine, counter_150 at 1920x1080: the
# full decode cost 100.7 ms a frame unoptimized (10 fps) and 9.1 ms optimized
# (109 fps); the timestamp-only decode cost 2.5 ms in both, so the cost is the
# pixel copy. Unoptimized, the read-ahead could never keep a 30 fps clip
# resident (the dress counted 37 misses). Optimizing this one crate in dev
# changes no behaviour, only its speed.
[profile.dev.package.nbe-decode]
opt-level = 3
