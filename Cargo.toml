[workspace]
resolver = "2"
members = [
    "crates/nbe-core",
    "crates/nbe-decode",
    "crates/nbe-engine",
    "crates/nbe-preflight",
    "crates/nbe-protocol",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
# jsonschema: add via `cargo add jsonschema --package nbe-core` (see agents/prompts/01-bootstrap-core-preflight.md)

[workspace.lints.rust]
# `deny`, not `forbid`: the render node needs Objective-C FFI to reach
# VideoToolbox for hardware decode (Prompt 05), and `forbid` cannot be
# relaxed even for a single module. The exception is exactly one module —
# `crates/nbe-engine/src/decode.rs` — which carries `#[allow(unsafe_code)]`
# with its justification. Every other crate and module remains denied, and a
# new `unsafe` block anywhere else is still a build failure.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
