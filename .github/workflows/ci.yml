name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Cargo cache. 438 s of cold release build on each job that shells
      # preflight, every run, was the tax for making that binary 8x faster —
      # this makes the warm case ~0.6 s and leaves the speed-up free.
      #
      # `rust-cache` is chosen over a hand-rolled `actions/cache` for one
      # property that matters here: it keys on `Cargo.lock` plus the rustc
      # version, and it **deletes the workspace's own crates from `target/`
      # before saving**, caching only dependencies. A cache that restored
      # `nbe-preflight` itself could hand a job a binary built from other
      # source — which is precisely the "stale binary looks fresh" failure this
      # project has already been bitten by once, in a falsification battery.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: the unsafe exception stays in crates/nbe-decode
        run: |
          # The workspace denies unsafe_code (root Cargo.toml). Exactly one
          # crate's PRODUCTION code is allowed to opt out, because Objective-C
          # FFI cannot exist without it. Anywhere else in `src/`, an opt-out is
          # a policy change wearing an attribute, and this gate refuses it.
          #
          # Test binaries are scoped out on purpose: the audio allocation gate
          # needs `unsafe impl GlobalAlloc` to count allocations, and a test
          # harness's allocator never ships. The policy protects what runs on
          # air, and this keeps the rule honest instead of granting the audio
          # crate a production exception it does not need.
          # `grep -r crates/` prints `crates//...` on GNU grep and `crates/...`
          # on BSD, so the path is normalized before filtering. Verifying this
          # gate only on macOS is what let that difference through once.
          hits=$(grep -rn "allow(unsafe_code)" crates --include=*.rs \
            | sed 's|//*|/|g' \
            | grep "/src/" \
            | grep -v "^crates/nbe-decode/" || true)
          if [ -n "$hits" ]; then
            echo "allow(unsafe_code) outside crates/nbe-decode:"
            echo "$hits"
            exit 1
          fi
          echo "unsafe exception confined to crates/nbe-decode/src"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace (summary echoed for the audit trail)
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/rust-test.log
          echo "::group::Rust test summary"
          grep "^test result" /tmp/rust-test.log
          grep "^test result" /tmp/rust-test.log \
            | awk '{p+=$4; f+=$6; i+=$8} END {printf "TOTAL: %d passed, %d failed, %d ignored\n", p, f, i}'
          echo "::endgroup::"
      - name: GPU/render tests actually ran (Prompt 04)
        # Runs the Prompt 04 render test suite headless on macos-14 (Metal).
        # If zero tests ran, the render gate is silently absent and CI passes
        # with no GPU exercise.
        run: |
          out=$(cargo test -p nbe-engine --test prompt04 2>&1)
          echo "$out"
          line=$(echo "$out" | grep "test result: ok")
          # The pattern is anchored on purpose. `.*: ([0-9]+) passed` never
          # matched "test result: ok. 15 passed" — sed passed the whole line
          # through, `[ "$ran" -eq 0 ]` errored, and an errored condition
          # inside `if` is just false, so the zero-tests branch was dead: a
          # prompt04 file with no tests left would have passed this gate.
          ran=$(echo "$line" | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
          case "$ran" in ''|*[!0-9]*) ran=0 ;; esac
          if [ "$ran" -eq 0 ]; then
            echo "expected at least one prompt04 test to run"; exit 1
          fi
          echo "prompt04 tests that ran: $ran"
      - name: the midmix suite actually ran (TRANSITIONS step 3)
        # GAP-6 duration edges (default-15, zero, one, over-max/no-clamp) +
        # GAP-11 start+1 bisection live here alongside Step 1's continuity
        # goldens.
        #
        # TWO floors, matching the 09 gate, because one cannot tell the
        # difference that matters. This step's comment originally claimed the
        # single `ran` floor meant "deleting OR SKIPPING one must fail the job".
        # Deleting, yes. Skipping, no: a capability-gated test prints SKIP,
        # returns, and reports `ok`, so `ran` is unchanged — that is exactly how
        # the Prompt 09 floors went green over an unexercised recording contract
        # until PR #18 measured it. `exercised = ran - skipped` cannot be
        # satisfied by skipping.
        #
        # The suite has no capability gate today (all 20 run everywhere, so the
        # floors are equal), and the exercised floor is what keeps that true: the
        # next hardware-touching test added here either runs on the runner or
        # fails this step. That is not hypothetical — `failed_quiesce_still_
        # clears_inflight_transition` opens a RecordSession, and on the
        # encoder-less runner it reds the job (run 35339778904) rather than
        # skipping, because it accepts either loud-finalize token instead of
        # gating itself off the machine.
        run: |
          set -u
          out=$(cargo test -p nbe-engine --test prompt04_midmix -- --nocapture 2>&1)
          echo "$out"
          line=$(echo "$out" | grep "test result: ok" || true)
          ran=$(echo "$line" | sed -E 's/^test result: ok[.] ([0-9]+) passed.*/\1/')
          case "$ran" in ''|*[!0-9]*) ran=0 ;; esac
          skipped=$(echo "$out" | grep -c '^SKIP' || true)
          case "$skipped" in ''|*[!0-9]*) skipped=0 ;; esac
          exercised=$((ran - skipped))
          echo "prompt04_midmix: ran=$ran skipped=$skipped exercised=$exercised (floors ran>=20 exercised>=20)"
          if [ "$ran" -lt 20 ]; then
            echo "expected at least 20 prompt04_midmix tests to run, got $ran"; exit 1
          fi
          if [ "$exercised" -lt 20 ]; then
            echo "expected at least 20 prompt04_midmix tests to actually execute rather than skip, got $exercised"; exit 1
          fi
      - name: overlay golden-frame tests actually ran (Prompt 07 step 5)
        # §7.10's suite is three levels in one target: index (2) + directive
        # (6, GPU-free) + render (5, headless wgpu golden frames, like
        # prompt04). The floor is the full count (13): a silently-skipped
        # render test drops the total below it and fails the job, so the
        # compositor cannot go unexercised while the gate stays green.
        run: |
          out=$(cargo test -p nbe-engine --test prompt07_overlay 2>&1)
          echo "$out"
          line=$(echo "$out" | grep "test result: ok")
          ran=$(echo "$line" | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
          case "$ran" in ''|*[!0-9]*) ran=0 ;; esac
          if [ "$ran" -lt 13 ]; then
            echo "expected at least 13 prompt07_overlay tests to run"; exit 1
          fi
          echo "prompt07_overlay tests that ran: $ran"
      - name: the 07b graphics suite actually ran
        run: |
          out=$(cargo test -p nbe-engine --test prompt07b_graphics 2>&1)
          echo "$out"
          line=$(echo "$out" | grep "test result: ok")
          ran=$(echo "$line" | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
          case "$ran" in ''|*[!0-9]*) ran=0 ;; esac
          # Floor, not a count: adding tests must not need a CI edit, but
          # deleting or skipping one must fail the job. Same shape as the
          # prompt04 and prompt07_overlay gates, and for the same reason — a
          # suite that silently runs zero tests is a green build that proves
          # nothing.
          if [ "$ran" -lt 14 ]; then
            echo "expected at least 14 prompt07b_graphics tests to run, got $ran"; exit 1
          fi
          echo "prompt07b_graphics tests that ran: $ran"
      - name: the bindings suite actually ran
        # Prompt 08's preflight binding checks (unknown action, bad payload,
        # incomplete trigger). Floor, not a count, same shape as the
        # prompt04/prompt07_overlay/prompt07b_graphics gates: a silently
        # skipped bindings test fails the job, so the binding rules cannot
        # go unexercised while the gate stays green.
        run: |
          out=$(cargo test -p nbe-preflight --test bindings 2>&1)
          echo "$out"
          line=$(echo "$out" | grep "test result: ok")
          ran=$(echo "$line" | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/')
          case "$ran" in ''|*[!0-9]*) ran=0 ;; esac
          if [ "$ran" -lt 3 ]; then
            echo "expected at least 3 bindings tests to run, got $ran"; exit 1
          fi
          echo "bindings tests that ran: $ran"
      - name: the 09 suites ran, and their runner-independent coverage is intact
        # TWO floors per suite, because one floor could not tell the difference
        # that matters.
        #
        # The previous version of this step counted `passed` and claimed "a
        # silently skipped suite fails the job, so the recording contract cannot
        # go unexercised while the gate stays green." That claim was FALSE, and
        # the two-key pass over PR #18 disproved it by measurement: these suites
        # are capability-gated (`hw_or_skip`, `aac_or_skip`, `ffprobe_or_skip`)
        # and a gated test prints SKIP to stderr, returns, and reports `ok`.
        # Force the H.264 probe to report absent and all ten suites return their
        # FULL passing counts — every floor satisfied, nothing exercised.
        # Measured on the normative machine:
        #
        #   no H.264 + no AAC:  60 ran, 27 skipped, 33 actually exercised
        #   prompt09_thread:     3 ran,  3 skipped,  0 actually exercised
        #
        # The exercised floors are min(two derivations), so no runner can flake
        # them: (a) the count of tests carrying NO capability gate at all, read
        # from the sources — 5/3/2/5/4/0/3/1/3/6; (b) the worst-case measurement
        # above — 5/2/3/6/4/0/3/1/3/6. Where they disagree the lower wins.
        #
        # So `ran` is kept (it catches a suite that stops compiling or loses
        # tests) and `exercised = ran - skipped` is added, floored at the
        # worst-case measurement above. That second floor cannot be satisfied by
        # skipping, which is the property the old comment claimed and lacked.
        #
        # Markers are matched as `^SKIP`, NOT `^SKIP:` — two of the thirteen
        # markers in the tree ("SKIP hardware roundtrip:", "SKIP read-only-dir
        # case:") carry no colon, and a `^SKIP:` grep silently misses them.
        #
        # PROVES: the suites exist, compile, run, and their runner-independent
        # coverage (seam-forced refusals, synthetic-unit paths, pure functions,
        # marker ordering) is intact.
        # DOES NOT PROVE: that recording works. That is the next step.
        run: |
          set -u
          rm -f /tmp/p09-coverage.txt
          fail=0
          for t in "prompt09_record:6:5" "prompt09_record_file:8:2" "prompt09_session:12:2" "prompt09_markers:8:5" "prompt09_telemetry:4:4" "prompt09_thread:3:0" "prompt09_feed:5:3" "prompt09_encode:2:1" "prompt09_residency:3:3" "prompt09_review:9:6"; do
            target=$(echo "$t" | cut -d: -f1)
            floor=$(echo "$t" | cut -d: -f2)
            exercised_floor=$(echo "$t" | cut -d: -f3)
            out=$(cargo test -p nbe-engine --test "$target" -- --nocapture 2>&1)
            echo "$out"
            line=$(echo "$out" | grep "test result: ok" || true)
            ran=$(echo "$line" | sed -E 's/^test result: ok[.] ([0-9]+) passed.*/\1/')
            case "$ran" in ''|*[!0-9]*) ran=0 ;; esac
            skipped=$(echo "$out" | grep -c '^SKIP' || true)
            case "$skipped" in ''|*[!0-9]*) skipped=0 ;; esac
            exercised=$((ran - skipped))
            echo "$target: ran=$ran skipped=$skipped exercised=$exercised (floors ran>=$floor exercised>=$exercised_floor)"
            if [ "$ran" -lt "$floor" ]; then
              echo "FAIL $target: expected at least $floor tests to run, got $ran"; fail=1
            fi
            if [ "$exercised" -lt "$exercised_floor" ]; then
              echo "FAIL $target: expected at least $exercised_floor tests to actually execute rather than skip, got $exercised"; fail=1
            fi
            echo "$target:$ran:$skipped:$exercised" >> /tmp/p09-coverage.txt
          done
          exit "$fail"
      - name: the zero-copy tap suite ran, and its runner-independent part is intact
        # Same two-floor shape as the 09 gate, for the same reason. Six of
        # this suite's ten tests need a wgpu adapter and skip loudly without
        # one; the other four (selection table, override refusal, streaming's
        # refused row, §10.1.1 completeness + telemetry reporting) run
        # everywhere and are the floor that skipping cannot satisfy.
        #
        # ran 6 -> 7 -> 10 across ZERO-COPY Phase 3b steps 2 and 3. Every test
        # added there needs an adapter (device reach drives `RenderLoop::new`;
        # the pool and the encode seam build real IOSurfaces), so they all join
        # the adapter-gated group and the exercised floor stays 4: the count of
        # tests that need no adapter has not changed since Phase 2.
        #
        # One of the ten skips on a SECOND axis — no hardware H.264 encoder —
        # and says which, so a macos-14 run reports both absences separately
        # rather than one undifferentiated "3 skipped".
        #
        # Added by PR #24's two-key pass: the suite shipped with NO gate at all,
        # so all six reported `ok` on CI and nothing said whether the GPU pair
        # had run or skipped. That inability was the finding.
        run: |
          set -u
          out=$(cargo test -p nbe-engine --test zerocopy_tap -- --nocapture 2>&1)
          echo "$out"
          line=$(echo "$out" | grep "test result: ok" || true)
          ran=$(echo "$line" | sed -E 's/^test result: ok[.] ([0-9]+) passed.*/\1/')
          case "$ran" in ''|*[!0-9]*) ran=0 ;; esac
          skipped=$(echo "$out" | grep -c '^SKIP' || true)
          case "$skipped" in ''|*[!0-9]*) skipped=0 ;; esac
          exercised=$((ran - skipped))
          echo "zerocopy_tap: ran=$ran skipped=$skipped exercised=$exercised (floors ran>=10 exercised>=4)"
          if [ "$ran" -lt 10 ]; then
            echo "FAIL zerocopy_tap: expected at least 10 tests to run, got $ran"; exit 1
          fi
          if [ "$exercised" -lt 4 ]; then
            echo "FAIL zerocopy_tap: expected at least 4 tests to actually execute rather than skip, got $exercised"; exit 1
          fi
          if [ "$skipped" -gt 0 ]; then
            echo "============================================================"
            echo "UNEXERCISED ON THIS RUNNER - $skipped zero-copy test(s) skipped."
            echo "$out" | grep '^SKIP' || true
            echo "No wgpu adapter here, so the IOSurface chain itself is NOT"
            echo "covered by this green build - only the selection table, the"
            echo "override refusal, and the telemetry reporting are. The chain's"
            echo "home is the normative machine (docs/hardware-baseline.txt)."
            echo "============================================================"
          else
            echo "No skips: this runner exercised the zero-copy chain itself."
          fi
      - name: 09 recording coverage on this runner (OBSERVATIONAL - reports, does not gate)
        # A REPORT, and its name says so, because macos-14 has no hardware H.264
        # encoder and the recording contract cannot be gated here at all. Exits
        # 0 by design.
        #
        # Deliberately NOT a `continue-on-error` gate that fails on every run:
        # work order DRESS settled that doctrine — a gate red on purpose teaches
        # reviewers to ignore red. The opposite failure, a gate GREEN about
        # something it cannot see, is what this pair of steps exists to end. The
        # hard floors above claim only what they prove; the unexercised truth is
        # printed here where nobody has to infer it from a passing count.
        #
        # Making recording genuinely gateable is the pending gate-split decision
        # (the user's call): separate the threshold claims from the composition
        # claims and run the hardware half on the normative machine, or on a
        # self-hosted runner that is one. Until then AC-6's home is
        # docs/hardware-baseline.txt, and a green run here is not evidence of it.
        run: |
          set -u
          total_ran=0; total_skipped=0
          while IFS=: read -r target ran skipped exercised; do
            total_ran=$((total_ran + ran)); total_skipped=$((total_skipped + skipped))
            if [ "$skipped" -gt 0 ]; then
              echo "  $target: $skipped of $ran tests SKIPPED (capability-gated), $exercised exercised"
            fi
          done < /tmp/p09-coverage.txt
          echo "09 recording coverage: $total_ran ran, $total_skipped skipped, $((total_ran - total_skipped)) exercised"
          if [ "$total_skipped" -gt 0 ]; then
            echo "============================================================"
            echo "UNEXERCISED ON THIS RUNNER - $total_skipped capability-gated tests skipped."
            echo "No hardware H.264 encoder here, so this green build does NOT cover:"
            echo "  * VideoToolbox H.264 encode (SPEC 9.2)"
            echo "  * the fMP4 writer, fragment cadence and moov placement (9.3)"
            echo "  * the AAC audio tap and A/V sync inside the file"
            echo "  * the marker sidecar written to disk"
            echo "  * AC-6 crash-safe recording (kill -9 mid-take)"
            echo "AC-6's home is the normative machine (docs/hardware-baseline.txt),"
            echo "where this suite runs with ZERO skips. Gating it here needs the"
            echo "gate-split decision. Do not read this step's exit 0 as evidence"
            echo "that recording works."
            echo "============================================================"
          else
            echo "No skips: this runner exercised the full recording contract."
          fi
      - name: overlay_show fixture passes (four overlay kinds)
        run: |
          cargo run -p nbe-preflight -- --package-path tests/fixtures/overlay_show
          grep -q '"airReady": true' tests/fixtures/overlay_show/preflight_report.json
      - name: v0.3 fixture passes
        run: |
          cargo run -p nbe-preflight -- --package-path tests/fixtures/valid_show_v0.3
          grep -q '"airReady": true' tests/fixtures/valid_show_v0.3/preflight_report.json
      - name: v0.2 fixture is rejected (migration gate)
        run: |
          code=0
          cargo run -p nbe-preflight -- --package-path tests/fixtures/valid_show || code=$?
          if [ "$code" -ne 2 ]; then echo "expected exit 2, got $code"; exit 1; fi
          grep -q 'migrationRequired' tests/fixtures/valid_show/preflight_report.json
          grep -q 'nbe-migrate' tests/fixtures/valid_show/preflight_report.json
  control-plane:
    # macOS, not ubuntu: this job builds `nbe-preflight`, which since Prompt 05
    # depends on `nbe-decode` for the SPEC §19 decode checks — and that is
    # VideoToolbox, so it only builds on macOS. Stubbing decode on Linux would
    # mean the preflight gates silently checked less there, which is the kind
    # of gate Standards §2 forbids.
    runs-on: macos-14
    env:
      # Standards §4: verify a build artifact before a later step consumes it.
      # The real release binary is ~13.5 MB. Under disk pressure `cargo build`
      # once produced a truncated 1,712-byte "release binary" and still exited
      # 0; the consuming step then failed `exit 127` and the failure read as a
      # defect in the code under test. One megabyte is far above any truncation
      # and far below a real build, so this floor catches that without being
      # sensitive to ordinary size drift.
      PREFLIGHT_MIN_BYTES: "1000000"
    defaults:
      run:
        working-directory: packages/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      # Cargo cache. 438 s of cold release build on each job that shells
      # preflight, every run, was the tax for making that binary 8x faster —
      # this makes the warm case ~0.6 s and leaves the speed-up free.
      #
      # `rust-cache` is chosen over a hand-rolled `actions/cache` for one
      # property that matters here: it keys on `Cargo.lock` plus the rustc
      # version, and it **deletes the workspace's own crates from `target/`
      # before saving**, caching only dependencies. A cache that restored
      # `nbe-preflight` itself could hand a job a binary built from other
      # source — which is precisely the "stale binary looks fresh" failure this
      # project has already been bitten by once, in a falsification battery.
      - uses: Swatinem/rust-cache@v2
      # Release, deliberately: the control plane shells this binary out of
      # `show.load`, and the debug build decodes at 130 ms/frame against
      # release's 16.7 — an 8x difference that decides whether an ordinary
      # rundown preflights in one minute or ten. `preflightBin()` prefers
      # `target/release` for the same reason.
      - run: cargo build -p nbe-preflight --release
        working-directory: .
      - name: the release binary is real, not a truncated write
        working-directory: .
        run: |
          bin=target/release/nbe-preflight
          size=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
          echo "nbe-preflight: $size bytes (floor $PREFLIGHT_MIN_BYTES)"
          if [ "$size" -lt "$PREFLIGHT_MIN_BYTES" ]; then
            echo "TRUNCATED BUILD: $bin is $size bytes, below the $PREFLIGHT_MIN_BYTES floor."
            echo "The build step exited 0 but did not write a whole binary — check disk space."
            exit 1
          fi
          # A size floor catches truncation; executing it catches a binary that
          # is the right size and still will not run.
          "$bin" --version
      # DIAGNOSTIC (work order PREFLIGHT-BOUND-2 §4). Times the streaming probe
      # on the runner, because whether a fixture gate may exercise the bound path
      # depends on the runner's spread, not on the dev machine's. Informational
      # only: `continue-on-error` means it cannot fail the job.
      - name: preflight timing on this runner (diagnostic, non-failing)
        working-directory: .
        continue-on-error: true
        run: |
          echo "runner: $(uname -m), $(sysctl -n hw.ncpu 2>/dev/null || nproc) cpus"
          for i in 1 2 3 4 5; do
            s=$(python3 -c 'import time;print(int(time.time()*1000))')
            target/release/nbe-preflight --package-path tests/fixtures/valid_show_v0.3 >/dev/null 2>&1
            e=$(python3 -c 'import time;print(int(time.time()*1000))')
            echo "  run $i: $((e - s)) ms"
          done
      - run: npm ci
      # The bound is enforced in the control plane, not in the binary, so a gate
      # that shells `nbe-preflight` directly proves the binary works and says
      # nothing about `show.load`. That gap is how a bound that killed a valid
      # package on this repository's own reference fixture survived four review
      # passes and reached `main` (docs/preflight-bound-memo.md).
      #
      # This step closes it: the reference fixture goes through `runPreflight`,
      # the path an operator's `show.load` takes, and the job fails if the bound
      # kills it or the run yields no verdict.
      #
      # Added only once the runner's own numbers made it safe to gate. Measured
      # on macos-14 (arm64, 3 cpus) by the diagnostic step above: 2,933-3,390 ms
      # against a 60,000 ms floor-derived bound — 17.7x headroom, spread 457 ms.
      # A gate whose margin is thin is a flake generator; this one is not, and
      # the diagnostic step stays so the margin remains visible if a runner
      # change erodes it.
      - name: show.load's preflight path is bounded and returns a verdict
        run: |
          cat > /tmp/bound-gate.ts <<'TS'
          import { runPreflight, preflightBound } from "./src/package.js";
          const pkg = "../../tests/fixtures/valid_show_v0.3";
          const bound = preflightBound(pkg);
          const t0 = Date.now();
          const r = await runPreflight(pkg);
          const elapsed = Date.now() - t0;
          console.log(`bound=${bound.ms}ms basis=${bound.basis} elapsed=${elapsed}ms timedOut=${r.timedOut} exit=${r.exitCode} report=${r.report ? "present" : "null"}`);
          if (r.timedOut) { console.error("FAIL: the bound killed a valid package"); process.exit(1); }
          if (r.report === null) { console.error("FAIL: no verdict returned"); process.exit(1); }
          if (r.report.airReady !== true) { console.error("FAIL: reference fixture is not air-ready"); process.exit(1); }
          // Fail at half the bound, not at the bound. A verdict that only
          // just fits is a flake waiting to happen, and the point is to go
          // red while there is still margin left to report — a check that
          // fired only on the kill would have passed at the 0.6% margin
          // that survived four review passes.
          if (elapsed > bound.ms * 0.5) { console.error(`FAIL: ${elapsed}ms used more than half of the ${bound.ms}ms bound`); process.exit(1); }
          console.log("OK: verdict returned with margin");
          TS
          cp /tmp/bound-gate.ts ./bound-gate.ts
          node --import tsx ./bound-gate.ts
          rm -f ./bound-gate.ts
      - run: npx tsc --noEmit
      - name: generated manifest types match the schema
        run: |
          npm run gen:manifest-types
          git diff --exit-code src/generated
      - name: vocabulary discipline (program/layer only in the alias table)
        working-directory: .
        run: |
          hits=$(grep -rn "program\.\|layer\." packages/control-plane/src \
            --include=*.ts \
            | grep -v "src/protocol.ts" \
            | grep -v "\.test\.ts" \
            | grep -v "^\s*//" || true)
          if [ -n "$hits" ]; then echo "vocabulary violation:"; echo "$hits"; exit 1; fi
      - name: tests pass and actually run (summary echoed for the audit trail)
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/cp-test.log
          echo "::group::Control-plane test summary"
          grep -E "^# (tests|pass|fail|skipped|todo) " /tmp/cp-test.log || true
          echo "::endgroup::"
          passed=$(grep -E "^# pass " /tmp/cp-test.log | awk '{print $3}')
          failed=$(grep -E "^# fail " /tmp/cp-test.log | awk '{print $3}')
          echo "passed=$passed failed=$failed"
          if [ "${failed:-1}" -ne 0 ]; then echo "expected 0 failures"; exit 1; fi
          # A glob that matches nothing must not pass as a green build.
          if [ "${passed:-0}" -lt 30 ]; then echo "expected at least 30 tests, got ${passed:-0}"; exit 1; fi

  # ---------------------------------------------------------------------------
  # The dress rehearsal ([RI-1]) — ADVISORY by decision, not by default.
  #
  # THE GATE SPLIT, decided 2026-09-17 (docs/prompt-map-07-13.md; the protocol
  # is docs/soak-protocol.md). This job's status is settled, so the next reader
  # does not re-open it:
  #
  #   (a) STRUCTURE GATES HERE, EVERYWHERE. Steps 1-11's composition and
  #       protocol claims are machine-independent and gate on every run, as do
  #       the Prompt 09 hard floors in the `rust` job.
  #   (b) HARDWARE CLAIMS GATE ON FAILURE, SKIP LOUDLY ON ABSENCE. The
  #       thresholds — zero View drops, zero underruns, record/sync/kill,
  #       AC-6 — run wherever the capability exists, and where they EXECUTED a
  #       failure fails. On this runner the capability is absent: macos-14 has
  #       no hardware H.264 encoder, so those steps skip loudly and the job
  #       stays green. It is 3 arm64 cores against a 6-core Intel reference
  #       machine (SPEC 0.3), and DRESS measured 83 then 120 underruns here
  #       against 0 there, so the thresholds are not measurable on this runner
  #       even when the encoder is.
  #   (c) THE SOAK IS THE GATE for everything in (b): weekly on the normative
  #       machine, and REQUIRED before anything called a release.
  #       `scripts/soak.sh`, PASS / FAIL / VOID.
  #
  # So this job is advisory because the claims it cannot measure were moved to
  # where they can be, NOT because it is tolerated as broken. Both failure modes
  # are named and rejected: a gate red on purpose (DRESS's lesson — it teaches
  # reviewers to ignore red) and a gate green about what it cannot see (PR #18's
  # 09 floors, which counted `passed` while a forced-absent encoder satisfied
  # every one of them). AC-6's home is docs/hardware-baseline.txt.
  #
  # A real control plane, the engine binary as a separate process, the real
  # WebSocket protocol, and a real 1920x1080/30 package with H.264+AAC media. It
  # is the only gate that proves the parts compose, and the only one that proves
  # the engine binary starts its audio driver (docs/review-midpoint-report.md
  # §3.10 — three Rust gates for that claim were written and all three were
  # defeated, because text a process prints is free to forge).
  #
  # PROMOTION ATTEMPTED AND REVERTED, 2026-09-11. The three findings that kept
  # this job red are CLOSED — 12/12 three times consecutively on the normative
  # machine, each fix falsified. The job is still advisory for a different
  # reason, and the distinction matters:
  #
  #   The gate step asserts `droppedFramesTotal == 0` and
  #   `audioUnderrunsTotal == 0`. Those are performance claims about REFERENCE
  #   hardware (§0.3: Intel, discrete AMD). This runner is macos-14 — 3 arm64
  #   cores — and measured 83 then 120 underruns plus a dropped frame, where the
  #   normative machine measures 0. §8.10 counts a missed 33 ms callback deadline
  #   as an underrun, and a shared CI VM cannot hold that cadence beside wgpu. No
  #   code change in this work order makes it.
  #
  # So requiring this job would block every PR on a hardware fact, which is a
  # worse version of the state promotion was meant to end. The corrected rule is
  # recorded in docs/prompt-map-07-13.md: three consecutive green runs on the
  # normative machine AND green on the runner that will gate it. The first half
  # was met; the second is not, and cannot be while the gate carries
  # reference-hardware thresholds.
  #
  # The findings, for the record:
  #
  #   R5  the clock did not advance within 2 ticks of show.start. The clock was
  #       never the defect: the engine applies directives in arrival order and
  #       show.load decodes every asset (10.7 s here), so show.start sat queued
  #       while the control plane had already recorded RUNNING. Step 2 now waits
  #       for §5.9.5 confirmation — the thing its own comment always claimed it
  #       waited for.
  #   R4  an underrun on the happy path. The audio cadence ran as a tokio task on
  #       the same worker pool as the wgpu render loop; at show.start the render
  #       loop spun up and audio missed its 33 ms deadline. §8.10 says a missed
  #       callback deadline IS an underrun, so the counter was right and the
  #       scheduling was wrong. Audio now owns a dedicated OS thread.
  #   R2  bus meters were a 33 ms sample taken once a second. Already fixed
  #       before this pass by peak-hold across the telemetry interval; verified
  #       here, and guarded by
  #       `a_transient_shorter_than_the_window_still_reaches_the_meter`.
  #
  # The promotion rule, corrected by this attempt: three consecutive green runs
  # on the normative machine (docs/hardware-baseline.txt) AND a green run on the
  # runner that will gate. Measured here: 12/12, 12/12, 12/12 on the normative
  # machine; 9-10 of 12 on the runner. The first half of that rule is what I had
  # written down, and it was not enough.
  #
  # WHAT THIS GATE PROVES AND WHAT IT CANNOT. The runner is macos-14, which is
  # arm64; the normative reference machine is Intel with discrete AMD graphics
  # (§0.3). A green run here proves the parts compose and the protocol holds. It
  # does NOT prove the frame budget or any timing threshold on the reference
  # hardware — those numbers only mean something measured on Intel. Never cite a
  # CI duration as a performance result.
  #
  # The artifact upload stays: engine.log, telemetry.jsonl and timings.json are
  # why a failure here is debuggable rather than merely red.
  dress-rehearsal:
    name: dress rehearsal
    runs-on: macos-14
    continue-on-error: true
    env:
      # Standards §4: verify a build artifact before a later step consumes it.
      # The real release binary is ~13.5 MB. Under disk pressure `cargo build`
      # once produced a truncated 1,712-byte "release binary" and still exited
      # 0; the consuming step then failed `exit 127` and the failure read as a
      # defect in the code under test. One megabyte is far above any truncation
      # and far below a real build, so this floor catches that without being
      # sensitive to ordinary size drift.
      PREFLIGHT_MIN_BYTES: "1000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      # Cargo cache. 438 s of cold release build on each job that shells
      # preflight, every run, was the tax for making that binary 8x faster —
      # this makes the warm case ~0.6 s and leaves the speed-up free.
      #
      # `rust-cache` is chosen over a hand-rolled `actions/cache` for one
      # property that matters here: it keys on `Cargo.lock` plus the rustc
      # version, and it **deletes the workspace's own crates from `target/`
      # before saving**, caching only dependencies. A cache that restored
      # `nbe-preflight` itself could hand a job a binary built from other
      # source — which is precisely the "stale binary looks fresh" failure this
      # project has already been bitten by once, in a falsification battery.
      - uses: Swatinem/rust-cache@v2
      # Both binaries are real dependencies: the rehearsal spawns the engine
      # and shells preflight. With either missing every step fails for a reason
      # unrelated to the show — measured at 12 of 12 with the engine absent.
      # Preflight in release for the same reason the control-plane job does:
      # the rehearsal shells it from `show.load`, and its 46 s cost in debug is
      # what makes step 3 flaky.
      - run: cargo build -p nbe-engine
      - run: cargo build -p nbe-preflight --release
      # Step 1 spawns the DEBUG preflight binary, which this job never built.
      # The step was therefore red on CI for as long as the job was advisory —
      # hidden by continue-on-error and a band that tolerated five failures —
      # and promotion turned it into 'nbe-preflight must be built'. Verified
      # against advisory run 34596023038: 'not ok 1' is there too. That is the
      # argument for promoting an advisory job, in one line.
      - run: cargo build -p nbe-preflight
      - name: the release binary is real, not a truncated write
        working-directory: .
        run: |
          bin=target/release/nbe-preflight
          size=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
          echo "nbe-preflight: $size bytes (floor $PREFLIGHT_MIN_BYTES)"
          if [ "$size" -lt "$PREFLIGHT_MIN_BYTES" ]; then
            echo "TRUNCATED BUILD: $bin is $size bytes, below the $PREFLIGHT_MIN_BYTES floor."
            echo "The build step exited 0 but did not write a whole binary — check disk space."
            exit 1
          fi
          # A size floor catches truncation; executing it catches a binary that
          # is the right size and still will not run.
          "$bin" --version
      - run: npm ci
        working-directory: packages/control-plane
      # ffprobe verifies the rehearsal's record step (bytes that parse, not a
      # returned ok). Pinned by PATH lookup in the test with fallbacks for
      # both Homebrew prefixes; installed here so the CI branch asserts
      # structure instead of skipping.
      - run: brew install ffmpeg
      - name: play the show
        working-directory: packages/control-plane
        run: |
          set -o pipefail
          # `|| true` was right while the job was advisory. A required gate must
          # not swallow the runner's status silently, but the summary below must
          # still be reached on failure — so the exit is noted and the explicit
          # checks below decide.
          npm run test:rehearsal 2>&1 | tee /tmp/dress.log || echo 'rehearsal exited non-zero'
          echo "::group::Dress rehearsal summary"
          grep -E "^# (tests|pass|fail) |^not ok " /tmp/dress.log || true
          echo "::endgroup::"
          # Zero assertions is a failure, never a skip (charter [RI-1]).
          #
          # Gating on "# tests" ALONE was itself defeatable, and an independent
          # pass defeated it: with the engine binary absent node still prints
          # "# tests 12 / # pass 0 / # fail 12", so `ran=12` passed the gate
          # while every step failed — the exact state the build step above
          # exists to prevent. Gate on what PASSED.
          ran=$(grep -E "^# tests " /tmp/dress.log | awk '{print $3}')
          passed=$(grep -E "^# pass " /tmp/dress.log | awk '{print $3}')
          failed=$(grep -E "^# fail " /tmp/dress.log | awk '{print $3}')
          echo "ran=${ran:-0} passed=${passed:-0} failed=${failed:-0}"
          if [ "${ran:-0}" -lt 12 ]; then
            echo "the rehearsal must run all 15 steps (12 + P9 record/sync/kill), ran ${ran:-0}"
            exit 1
          fi
          # The band stays, and the reason has CHANGED. It used to tolerate R2,
          # R4 and R5 being red by design. Those are closed — 12/12 three times
          # consecutively on the normative machine. It now tolerates the runner:
          # macos-14 gives 3 arm64 cores, and the gate step asserts
          # droppedFramesTotal == 0 and audioUnderrunsTotal == 0, which are
          # performance claims about REFERENCE hardware. Measured on this runner:
          # 83 and 120 underruns in two runs, and a dropped frame, where the
          # normative machine gives 0. No code change makes a shared CI VM hold a
          # 33 ms audio cadence next to wgpu.
          if [ "${passed:-0}" -lt 9 ]; then
            echo "expected at least 9 passing steps, got ${passed:-0}"
            exit 1
          fi
          if [ "${failed:-99}" -gt 3 ]; then
            echo "expected at most 3 failing steps (the hardware-bound gate assertions), got ${failed:-99}"
            exit 1
          fi
      - name: failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dress-rehearsal-artifacts
          path: target/dress-rehearsal/
          if-no-files-found: warn
