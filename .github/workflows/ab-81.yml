name: ab-81 (throwaway A/B, DO NOT MERGE)

# The user's ruling of 2026-11-04, item 1: #81's rust red is not rerun. This
# A/B loops the two prompt10_rtmp tests that went red on #81's run 41795102544
# (attempt 1), 30 times each, on #80's head and on #81's head, in ONE job on
# ONE runner, so both arms share the runner image and the VM. Runs alternate
# A B / B A by iteration so neither arm always runs first. Each run is the
# test alone (`--exact`), from a cold-built debug test binary per arm, each arm
# in its own worktree and its own target dir.
#
# This branch deletes ci.yml so the full CI does not run here: it would be a
# rerun of #81's rust job, which the ruling forbids. The branch and its PR are
# closed and deleted after the read.

on:
  pull_request:

env:
  NBE_AUDIO_SINK: "null"
  # What Swatinem/rust-cache sets in ci.yml's rust job, so the arms are built
  # the way CI builds them.
  CARGO_INCREMENTAL: "0"
  ARM_A: 74937d8dc2eb43667ab04380a155786618cd8838
  ARM_B: ccc4e444edf4ef9b72a3836d8a745644ab1c1949
  RUNS: "30"

jobs:
  ab:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - name: the runner image and the toolchain
        timeout-minutes: 5
        run: |
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?}"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          rustc -Vv
          cargo -V
      - name: build each arm's prompt10_rtmp, cold, in its own worktree and target dir
        timeout-minutes: 75
        run: |
          set -euo pipefail
          for arm in a b; do
            if [ "$arm" = a ]; then sha="$ARM_A"; else sha="$ARM_B"; fi
            wt="$RUNNER_TEMP/wt-$arm"
            git worktree add --detach "$wt" "$sha"
            echo "arm $arm: $(git -C "$wt" log -1 --format='%H %s')"
            start=$(date +%s)
            ( cd "$wt" && cargo test -p nbe-engine --test prompt10_rtmp --no-run 2>&1 ) | tee "$RUNNER_TEMP/build-$arm.log"
            echo "arm $arm: built in $(( $(date +%s) - start )) s"
            exe=$(sed -nE 's/.*Executable tests\/prompt10_rtmp\.rs \((.*)\).*/\1/p' "$RUNNER_TEMP/build-$arm.log")
            echo "arm $arm: binary $wt/$exe"
            shasum -a 256 "$wt/$exe"
            echo "$wt/$exe" > "$RUNNER_TEMP/exe-$arm"
          done
          # Each arm is what it claims: #81's catch-up warn line is compiled
          # into arm B's binary and absent from arm A's.
          marker="null sink woke too late to catch up"
          a=$(grep -a -c "$marker" "$(cat "$RUNNER_TEMP/exe-a")" || true)
          b=$(grep -a -c "$marker" "$(cat "$RUNNER_TEMP/exe-b")" || true)
          echo "catch-up marker: arm a $a, arm b $b"
          if [ "$a" -ne 0 ] || [ "$b" -lt 1 ]; then echo "FAIL: the arms are not the heads they claim"; exit 1; fi
      - name: loop the two tests, 30 runs each per arm, interleaved
        timeout-minutes: 75
        run: |
          set -u
          out="$RUNNER_TEMP/ab"
          mkdir -p "$out"
          echo "i,test,arm,order,verdict,rc,secs,load1_before,detail" > "$out/results.csv"
          for i in $(seq 1 "$RUNS"); do
            for t in both_live_stream_shares_the_record_composite transport_death_leaves_the_loop_untouched; do
              if [ $((i % 2)) -eq 1 ]; then order="a b"; else order="b a"; fi
              for arm in $order; do
                log="$out/$i-$t-$arm.log"
                load1=$(sysctl -n vm.loadavg | awk '{print $2}')
                start=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
                ( cd "$RUNNER_TEMP/wt-$arm" && perl -e 'alarm shift; exec @ARGV' 300 \
                    cargo test -p nbe-engine --test prompt10_rtmp -- --exact "$t" --nocapture ) > "$log" 2>&1 && rc=0 || rc=$?
                end=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
                secs=$(echo "$end - $start" | bc)
                # Rule 8: a run that skipped, or ran anything but this one
                # test, is not a pass. It is INVALID, and fails the job below.
                if grep -q '^SKIP' "$log" || ! grep -q '^running 1 test$' "$log"; then
                  verdict=INVALID
                elif [ "$rc" -eq 0 ] && grep -q '^test result: ok\. 1 passed; 0 failed' "$log"; then
                  verdict=PASS
                elif grep -q '^test result: FAILED\. 0 passed; 1 failed' "$log"; then
                  verdict=FAIL
                else
                  verdict=ERROR
                fi
                detail=$(grep -E '^(BOTH LIVE|SURVIVAL):' "$log" | tr ',' ';' | tr '\n' ' ')
                echo "$i,$t,$arm,${order// /},$verdict,$rc,$secs,$load1,$detail" | tee -a "$out/results.csv"
              done
            done
          done
      - name: pass counts with Wilson intervals
        if: always()
        timeout-minutes: 5
        run: |
          python3 -I - "$RUNNER_TEMP/ab/results.csv" <<'EOF'
          import csv, math, sys, collections
          z = 1.959963984540054
          def wilson(k, n):
              if n == 0:
                  return (float("nan"), float("nan"))
              p = k / n
              d = 1 + z * z / n
              c = (p + z * z / (2 * n)) / d
              h = z * math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d
              return (c - h, c + h)
          rows = list(csv.DictReader(open(sys.argv[1])))
          by = collections.defaultdict(collections.Counter)
          for r in rows:
              by[(r["test"], r["arm"])][r["verdict"]] += 1
          bad = 0
          for (t, arm), c in sorted(by.items()):
              n = sum(c.values())
              k = c["PASS"]
              lo, hi = wilson(k, n)
              print(f"{t} arm {arm}: {k}/{n} pass, 95% Wilson [{lo:.3f}, {hi:.3f}]; verdicts {dict(c)}")
              bad += c["INVALID"]
          if bad:
              print(f"FAIL: {bad} INVALID runs (a skip, or not exactly one test ran)")
              sys.exit(1)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: ab-81-results
          path: ${{ runner.temp }}/ab
