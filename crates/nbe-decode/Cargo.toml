[package]
name = "nbe-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware video decode (VideoToolbox via AVFoundation), shared by the render node and preflight"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSDictionary", "NSValue", "NSArray", "NSError", "NSObject", "NSEnumerator"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMTime", "CMFormatDescription", "CMBase", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVPixelFormatDescription"] }

[lints]
workspace = true
