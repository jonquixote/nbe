[package]
name = "nbe-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nbe-protocol = { path = "../nbe-protocol" }
nbe-core = { path = "../nbe-core" }
nbe-decode = { path = "../nbe-decode", features = ["gpu-tap"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake", "url"] }
futures-util = "0.3"
wgpu = "30.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Text shaping and rasterization for the graphics layer (07b). Default features
# are OFF deliberately: they pull system font discovery, and §0.1 assumption 11
# forbids a host-system fallback — every face must come from the show package.
# `swash` is the rasterizer; `std` is the allocator. No fontconfig, no
# fontdb source-loading of system directories.
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
# Free space on the record target (recordSpaceMib, record.start's E_DISK check)
# through one statvfs-style call instead of forking `df` (R36's follow-up: a
# process spawn from inside the engine measured 1.9-3.1 s). fs4 is the
# maintained fork of fs2 (fs2 0.4.3 is from 2018), MIT OR Apache-2.0; its
# `available_space` is statvfs's f_bavail x f_frsize on Unix (df's Available)
# and GetDiskFreeSpaceExW on Windows, where `df` does not exist. It requires only
# rustix (Unix; already in the lockfile) and windows-sys (Windows). Default
# features are off: no async runtimes, no fs-err. Its unsafe stays in fs4, so
# this crate's `unsafe_code = "deny"` holds.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }

# Device audio (the device-audio design record, D1 and D7): program audio to
# the default output device, macOS only. cpal is safe over coreaudio-rs and
# the `objc2` family nbe-decode already pins; the two HAL reads it does not
# expose live in nbe-decode's `device-audio` feature. Elsewhere the engine
# builds the null sink alone, and no ALSA crate is ever resolved for a build
# (the target gate keeps cpal's Linux backend out).
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
nbe-decode = { path = "../nbe-decode", features = ["gpu-tap", "device-audio"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[lints]
workspace = true
